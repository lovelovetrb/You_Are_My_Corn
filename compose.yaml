version: "3.9"

services:
  frontend:
    container_name: "you_are_my_corn_frontend"
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    volumes:
      - ./frontend/source:/usr/src/frontend
      - node_modules:/usr/src/frontend/node_modules
    restart: always
    command: sh -c "npm install && npm run dev"
    ports:
      - "80:80"

  backend:
    container_name: "you_are_my_corn_backend"
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    volumes:
      - ./backend/app:/usr/src/backend/app
    ports:
      - 5001:5001

volumes:
  node_modules:
